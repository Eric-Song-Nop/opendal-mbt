name: Native release artifacts

on:
  pull_request:
    paths:
      - .github/workflows/native-release.yml
      - build.js
      - Cargo.lock
      - Cargo.toml
      - integration/consumer/**
      - moon.mod
      - native/artifact-selection.json
      - native/distribution-profile.json
      - native/distribution-profiles/**
      - native/artifacts.json
      - native/artifacts-standard.json
      - native/include/opendal_mbt.h
      - native/rust/**
      - rust-toolchain.toml
      - src/**
      - scripts/check-packaged-consumer.sh
      - scripts/check-native-library-info.py
      - scripts/check-version-metadata.py
      - scripts/test-distribution-profiles.py
      - scripts/package-native-artifact.py
      - scripts/prepare-test-native-cache.js
      - scripts/render-registry-consumer.py
      - scripts/test-package-native-artifact.py
      - scripts/test-native-library-info.py
      - scripts/test-render-registry-consumer.py
      - scripts/test-version-metadata.py
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

env:
  MOONBIT_VERSION: 0.10.6+80dc50f24

jobs:
  artifact:
    name: ${{ matrix.rust_target }} artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            rust_target: aarch64-apple-darwin
            macos_deployment_target: "11.0"
          - os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            macos_deployment_target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Select candidate or release validation
        id: artifact-mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "mode=candidate" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Test artifact profiles, packager, and version metadata
        run: |
          python3 scripts/test-distribution-profiles.py
          python3 scripts/test-package-native-artifact.py
          python3 scripts/test-native-library-info.py
          python3 scripts/test-render-registry-consumer.py
          python3 scripts/test-version-metadata.py
          python3 scripts/check-version-metadata.py
      - name: Build release static library
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/native-release
          CARGO_TERM_COLOR=never cargo rustc \
            -p opendal-mbt-native --locked --release \
            --no-default-features --features profile-standard \
            -- --print native-static-libs 2>&1 | \
            tee target/native-release/native-static-libs.log
          grep -q 'native-static-libs:' \
            target/native-release/native-static-libs.log
          actual_target=$(rustc -vV | sed -n 's/^host: //p')
          test "$actual_target" = '${{ matrix.rust_target }}'
      - name: Package standard native artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package-native-artifact.py \
            --repo-root . \
            --library target/release/libopendal_mbt_native.a \
            --native-static-libs-log \
              target/native-release/native-static-libs.log \
            --service-profile standard \
            --rust-target '${{ matrix.rust_target }}' \
            --output-dir target/native-dist \
            --mode '${{ steps.artifact-mode.outputs.mode }}' \
            --artifact-table native/artifacts-standard.json | \
            tee target/native-release/package-result.json
      - name: Test clean packaged Moon consumer
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find target/native-dist -name '*.tar.gz' -type f)
          test -n "$archive"
          candidate_table=""
          if [[ '${{ steps.artifact-mode.outputs.mode }}' == 'candidate' ]]; then
            candidate_table=$(find target/native-dist \
              -name '*.candidate-artifacts.json' -type f)
            test -n "$candidate_table"
          fi
          make packaged-consumer \
            NATIVE_ARTIFACT="$archive" \
            NATIVE_ARTIFACT_TABLE="$candidate_table"
      - name: Verify native library release identity
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(find target/native-dist -name '*.manifest.json' -type f)
          test -n "$manifest"
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' moon.mod)
          if [[ '${{ steps.artifact-mode.outputs.mode }}' == 'release' ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          python3 scripts/check-native-library-info.py \
            --repo-root . \
            --library target/release/libopendal_mbt_native.a \
            --manifest "$manifest" \
            --expected-version "$version" \
            --expected-profile standard
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rust_target }}
          path: target/native-dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish native release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: artifact
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: target/native-dist
          merge-multiple: true
      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' moon.mod)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Configure Moon package credentials
        env:
          MOONCAKES_CREDENTIALS_JSON: ${{ secrets.MOONCAKES_CREDENTIALS_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MOONCAKES_CREDENTIALS_JSON"
          mkdir -p "$HOME/.moon"
          umask 077
          printf '%s' "$MOONCAKES_CREDENTIALS_JSON" > \
            "$HOME/.moon/credentials.json"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            target/native-dist/*.tar.gz
            target/native-dist/*.tar.gz.sha256
            target/native-dist/*.manifest.json
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --generate-notes \
              --title "opendal-mbt $GITHUB_REF_NAME"
          fi
      - name: Publish Moon package
        run: moon publish --frozen
      - name: Verify the published package from a clean registry consumer
        shell: bash
        run: |
          set -euo pipefail
          consumer=target/published-consumer
          release_version=${GITHUB_REF_NAME#v}
          python3 scripts/render-registry-consumer.py \
            --repo-root . \
            --output-dir "$consumer" \
            --version "$release_version"
          cd "$consumer"
          for attempt in 1 2 3 4 5; do
            if moon update && moon test --target native \
              --warn-list '-68+73' --deny-warn; then
              exit 0
            fi
            moon clean
            sleep 10
          done
          exit 1
