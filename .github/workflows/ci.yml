name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  MOONBIT_VERSION: 0.10.6+80dc50f24

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          rustc --version
          cargo --version
          moon version --all
      - name: Check formatting, lints, MoonBit, and C ABI
        run: make check

  native:
    name: ${{ matrix.os }} / ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
        profile:
          - debug
          - release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Run Rust and MoonBit tests
        run: make test-profile RUST_PROFILE=${{ matrix.profile }}
      - name: Test the packaged downstream consumer
        if: matrix.os == 'ubuntu-24.04' && matrix.profile == 'debug'
        run: make packaged-consumer RUST_PROFILE=debug
      - name: Run the C consumer
        if: matrix.profile == 'release'
        run: make c-example RUST_PROFILE=release

  coverage:
    name: Coverage and C/MoonBit ASan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Run coverage
        run: make coverage
      - name: Run AddressSanitizer
        run: make asan
